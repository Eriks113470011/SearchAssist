name: Search and study checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run simulate -- --config configs/simulator-profiles.json --output simulation-runs/ci-profiles
      - run: python3 tests/verify-simulation.py simulation-runs/ci-profiles
      - run: npm run investigate -- --config configs/investigation-profiles.json --output simulation-runs/ci-investigation-profiles
      - run: python3 tests/verify-investigation.py simulation-runs/ci-investigation-profiles
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-qa-${{ github.run_id }}
          path: simulation-runs/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify downloaded ZIP bundles independently
        run: python3 tests/verify-bundles.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
  simulator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:simulator-browser
      - run: python3 tests/verify-simulation.py simulation-runs/ci-browser-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-runner-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore
  recovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:recovery-browser
      - run: python3 tests/verify-simulation.py simulation-runs/ci-recovery-full
      - run: python3 tests/verify-simulation.py simulation-runs/ci-recovery-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore

  investigation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:investigation-browser
      - run: python3 tests/verify-investigation.py simulation-runs/ci-investigation-browser
      - run: python3 tests/verify-simulation.py simulation-runs/ci-failure-inspector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore

  broad-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate:broad -- --config configs/validation-challenges.json --output simulation-runs/ci-broad-challenges
      - run: python3 tests/verify-validation.py simulation-runs/ci-broad-challenges
      - run: npm run investigate -- --config configs/investigation-broad-model.json --output simulation-runs/ci-broad-model
      - run: python3 tests/verify-investigation.py simulation-runs/ci-broad-model
      - run: npm run investigate -- --config configs/investigation-broad-controls.json --output simulation-runs/ci-broad-controls
      - run: python3 tests/verify-investigation.py simulation-runs/ci-broad-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-model-qa-${{ github.run_id }}
          path: simulation-runs/
          if-no-files-found: ignore

  broad-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:validation-browser
      - run: python3 tests/verify-investigation.py simulation-runs/ci-broad-browser
      - run: python3 tests/verify-validation.py simulation-runs/ci-challenge-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-browser-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore

  constraints-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate:constraints -- --config configs/validation-constraints.json --output simulation-runs/ci-constraints
      - run: python3 tests/verify-constraints.py simulation-runs/ci-constraints
      - run: npm run investigate -- --config configs/investigation-constraints-model.json --output simulation-runs/ci-constraints-directory
      - run: python3 tests/verify-investigation.py simulation-runs/ci-constraints-directory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constraints-model-qa-${{ github.run_id }}
          path: simulation-runs/
          if-no-files-found: ignore

  constraints-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: node tests/constraint-browser.mjs
      - run: python3 tests/verify-investigation.py simulation-runs/ci-constraints-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constraints-browser-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore

