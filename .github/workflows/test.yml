name: Search and study checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run simulate -- --config configs/simulator-profiles.json --output simulation-runs/ci-profiles
      - run: python3 tests/verify-simulation.py simulation-runs/ci-profiles
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-qa-${{ github.run_id }}
          path: simulation-runs/ci-profiles/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify downloaded ZIP bundles independently
        run: python3 tests/verify-bundles.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
  simulator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: npm run test:simulator-browser
      - run: python3 tests/verify-simulation.py simulation-runs/ci-browser-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-runner-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore
  recovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Use an installed Chromium browser when available
        run: |
          searchassist_chromium_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$searchassist_chromium_path" ]; then
            printf 'SEARCHASSIST_CHROMIUM_PATH=%s\n' "$searchassist_chromium_path" >> "$GITHUB_ENV"
          fi
      - if: env.SEARCHASSIST_CHROMIUM_PATH == ''
        run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:recovery-browser
      - run: python3 tests/verify-simulation.py simulation-runs/ci-recovery-full
      - run: python3 tests/verify-simulation.py simulation-runs/ci-recovery-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-qa-${{ github.run_id }}
          path: |
            test-results/
            simulation-runs/
          if-no-files-found: ignore
